spring.application.name=CityCourier
server.port=9000
spring.datasource.url=jdbc:h2:./db/basedatos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/

cc.logistica.coste-km=0.20
cc.logistica.recargo-peso=0.25
cc.logistica.horas-riesgo=24

cc.logistica.co2-moto=80
cc.logistica.co2-furgoneta=150