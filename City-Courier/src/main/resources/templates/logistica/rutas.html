<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rutas - City Courier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <div id="row 1" class="row text flex-grow-1 m-0">

        <aside sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/general :: asideAdmin}"></aside>

        <aside sec:authorize="hasRole('LOGISTICA') and !hasRole('ADMIN')"
            th:replace="~{fragments/general :: asideLogistica}"></aside>

        <main id="main" class="col-md-10 col-12 p-3 p-md-4">
            <div class="bg-white rounded-5 shadow-lg h-100 p-4 p-md-5">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
                    <div>
                        <h3 class="fw-bold text-success m-0"><i class="bi bi-geo-alt-fill me-2"></i>Gestión de Rutas
                        </h3>
                        <p class="text-muted m-0 mt-1">Diseño y control de trayectos de entrega.</p>
                    </div>

                    <a th:href="@{/logistica/rutas/nuevo}"
                        class="btn btn-success rounded-pill px-4 shadow-sm py-2 fw-medium">
                        <i class="bi bi-map me-2"></i> Diseñar Ruta
                    </a>
                </div>

                <form th:action="@{/logistica/rutas}" method="get" class="mb-4">
                    <div
                        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center bg-light p-3 rounded-4 border">
                        <h5 class="fw-bold text-primary m-0 mb-3 mb-md-0"><i class="bi bi-search me-2"></i>Localizador
                        </h5>
                        <div class="input-group w-auto bg-white rounded-pill shadow-sm overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted"><i
                                    class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-0 shadow-none"
                                placeholder="ID de envío o destino..." name="criterio">
                            <button type="submit" class="btn btn-success px-4 fw-medium">Buscar</button>
                        </div>
                    </div>
                </form>

                <div class="p-4 text-center border rounded-4 border-success border-opacity-25 bg-light">
                    <div th:replace="~{fragments/logisticaTables :: listaRutas}"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script id="accionesRuta" th:src="@{/script/accionesRuta.js}"></script>

</body>

</html>
