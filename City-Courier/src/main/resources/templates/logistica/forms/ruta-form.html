<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ruta - City Courier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <div id="row 1" class="row text flex-grow-1 m-0">

        <aside th:replace="~{fragments/general :: asideLogistica}"></aside>

        <main id="main" class="col-md-10 col-12 p-3 p-md-4">

            <div class="bg-white rounded-5 shadow-lg h-100 p-4 p-md-5">

                <div class="mb-4">
                    <a th:href="@{/logistica/rutas}"
                        class="btn btn-link text-decoration-none p-0 text-success fw-medium">
                        <i class="bi bi-arrow-left me-1"></i> Volver a Gestión de Rutas
                    </a>
                </div>

                <h3 class="fw-bold text-success mb-4 pb-2 border-bottom">
                    <i class="bi bi-map-fill me-2"></i>
                    <span th:text="${ruta.codigoRuta != null} ? 'Editar Ruta' : 'Diseñar Nueva Ruta'">Formulario</span>
                </h3>

                <form method="post" th:action="@{/logistica/rutas}" id="rutaForm" th:object="${ruta}"
                    class="needs-validation" novalidate>

                    <input type="hidden" id="codigoRuta" th:field="*{codigoRuta}">

                    <fieldset class="mb-5">
                        <h6 class="text-success fw-bold mb-4">
                            <i class="bi bi-info-circle me-2"></i>Información General
                        </h6>

                        <div class="row g-3">
                            <div class="col-12 col-md-8 col-lg-7">
                                <label for="nombreRuta"
                                    class="form-label fw-medium text-secondary small text-uppercase">Nombre de la
                                    Ruta</label>
                                <input type="text" class="form-control bg-light border-0 shadow-sm py-2" id="nombreRuta"
                                    th:field="*{nombreRuta}" placeholder="Ej. Ruta Centro y Nervión" required>
                                <div class="invalid-feedback">Debe introducir un nombre de ruta válido.</div>
                                <div th:if="${#fields.hasErrors('nombreRuta')}" class="text-danger small">
                                    <span th:errors="*{nombreRuta}"></span>
                                </div>
                            </div>
                            <div class="col-12 col-md-4 col-lg-3 offset-lg-1">
                                <label for="distancia"
                                    class="form-label fw-medium text-secondary small text-uppercase">Distancia
                                    Estimada</label>
                                <div class="input-group shadow-sm">
                                    <input type="number" min="0" step="5" class="form-control bg-light border-0 py-2"
                                        id="distancia" placeholder="Ej. 25.5" name="distancia" required>
                                    <span class="input-group-text bg-light border-0 text-muted">km</span>
                                </div>
                                <div class="invalid-feedback">Debe introducir una distancia válida.</div>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="mb-5 border-top pt-4">
                        <h6 class="text-success fw-bold mb-4">
                            <i class="bi bi-geo-alt me-2"></i>Itinerario Geográfico
                        </h6>

                        <div class="row g-4 align-items-center">
                            <div class="col-12 col-md-5">
                                <label for="puntoEntrega"
                                    class="form-label fw-medium text-secondary small text-uppercase">Punto de
                                    Origen</label>
                                <select class="form-select bg-light border-0 shadow-sm py-2" id="puntoEntrega"
                                    name="zonaSeleccionada" required>
                                    <option value="" disabled selected>Seleccione inicio...</option>
                                    <option value="Arahal">Arahal</option>
                                    <option value="Carmona">Carmona</option>
                                    <option value="Écija">Écija</option>
                                    <option value="Fuentes de Andalucía">Fuentes de Andalucía</option>
                                    <option value="La Lantejuela">La Lantejuela</option>
                                    <option value="Marchena">Marchena</option>
                                    <option value="Morón">Morón de la Frontera</option>
                                    <option value="Osuna">Osuna</option>
                                    <option value="Paradas">Paradas</option>
                                    <option value="Utrera">Utrera</option>
                                </select>
                                <div class="invalid-feedback">Debe seleccionar un punto de inicio.</div>
                            </div>

                            <div class="col-12 col-md-2 text-center text-muted d-none d-md-block pt-3">
                                <i class="bi bi-arrow-right fs-4"></i>
                            </div>

                            <div class="col-12 col-md-5">
                                <label for="PuntoFinalizacion"
                                    class="form-label fw-medium text-secondary small text-uppercase">Punto de
                                    Finalización</label>
                                <select class="form-select bg-light border-0 shadow-sm py-2" id="PuntoFinalizacion"
                                    name="zonaSeleccionada" required>
                                    <option value="" disabled selected>Seleccione destino...</option>
                                    <option value="Arahal">Arahal</option>
                                    <option value="Carmona">Carmona</option>
                                    <option value="Écija">Écija</option>
                                    <option value="Fuentes de Andalucía">Fuentes de Andalucía</option>
                                    <option value="La Lantejuela">La Lantejuela</option>
                                    <option value="Marchena">Marchena</option>
                                    <option value="Morón">Morón de la Frontera</option>
                                    <option value="Osuna">Osuna</option>
                                    <option value="Paradas">Paradas</option>
                                    <option value="Utrera">Utrera</option>
                                </select>
                                <div class="invalid-feedback">Debe seleccionar un punto de finalización.</div>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="mb-5 border-top pt-4">
                        <h6 class="text-success fw-bold mb-4">
                            <i class="bi bi-clock-history me-2"></i>Ventana Horaria
                        </h6>

                        <div class="row g-4">
                            <div class="col-12 col-md-6 col-lg-5">
                                <label for="fechaInicio"
                                    class="form-label fw-medium text-secondary small text-uppercase">Hora de Salida
                                    Estimada</label>
                                <input type="time" class="form-control bg-light border-0 shadow-sm py-2"
                                    id="fechaInicio" name="fechaInicio"
                                    th:value="${ruta.fechaInicio != null} ? ${#temporals.format(ruta.fechaInicio, 'HH:mm')} : ''"
                                    required>
                                <div class="invalid-feedback">Requerido.</div>
                                <div th:if="${#fields.hasErrors('fechaInicio')}" class="text-danger small">
                                    <span th:errors="*{fechaInicio}"></span>
                                </div>
                            </div>

                            <div class="col-12 col-md-6 col-lg-5 offset-lg-1">
                                <label for="fechaFinal"
                                    class="form-label fw-medium text-secondary small text-uppercase">Hora de Llegada
                                    Estimada</label>
                                <input type="time" class="form-control bg-light border-0 shadow-sm py-2" id="fechaFinal"
                                    name="fechaFinal"
                                    th:value="${ruta.fechaFinal != null} ? ${#temporals.format(ruta.fechaFinal, 'HH:mm')} : ''"
                                    required>
                                <div class="invalid-feedback">Requerido.</div>
                                <div th:if="${#fields.hasErrors('fechaFinal')}" class="text-danger small">
                                    <span th:errors="*{fechaFinal}"></span>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <div class="d-flex justify-content-end gap-3 mt-5 pt-4 border-top">
                        <a th:href="@{/logistica/rutas}"
                            class="btn btn-light border px-4 rounded-pill text-secondary fw-medium shadow-sm">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success px-5 rounded-pill shadow-sm fw-medium">
                            <i class="bi bi-save me-2"></i> Guardar Ruta
                        </button>
                    </div>

                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script id="validationForm" th:src="@{/script/validationForm.js}"></script>

</body>

</html>
