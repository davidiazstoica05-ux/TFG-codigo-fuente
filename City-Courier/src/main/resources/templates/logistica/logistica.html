<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Logística - City Courier</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <div id="row 1" class="row text flex-grow-1 m-0">

        <aside th:replace="~{fragments/general :: asideLogistica}"></aside>

        <main id="main" class="col-md-10 col-12 p-3 p-md-4">

            <div class="bg-white rounded-5 shadow-lg h-100 p-4 p-md-5">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
                    <div>
                        <h3 class="fw-bold text-primary m-0"><i class="bi bi-bezier2 me-2"></i>Centro de Operaciones
                        </h3>
                        <p class="text-muted m-0 mt-1">Control de paquetería, rutas y flota asignada.</p>
                    </div>
                    <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm py-2 fw-medium"
                        data-bs-toggle="modal" data-bs-target="#modalCrearEnvio" tipo="envio">
                        <i class="bi bi-box-seam-fill me-2"></i> Registrar Nuevo Envío
                    </button>
                </div>

                <div id="rowResumen" class="row row-cols-1 row-cols-md-3 g-4 mb-5">

                    <div class="col">
                        <div
                            class="card border-0 rounded-4 shadow-sm h-100 bg-white border-start border-5 border-success">
                            <div class="card-body d-flex align-items-center p-4">
                                <div class="bg-success bg-opacity-10 p-3 rounded-4 me-3 text-success">
                                    <i class="bi bi-box-seam fs-2"></i>
                                </div>
                                <div>
                                    <p class="text-muted fw-semibold mb-0 text-uppercase" style="font-size: 0.8rem;">
                                        Envíos Activos</p>
                                    <h2 class="fw-bold text-dark mb-0">45</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card border-0 rounded-4 shadow-sm h-100 bg-white border-start border-5 border-info">
                            <div class="card-body d-flex align-items-center p-4">
                                <div class="bg-info bg-opacity-10 p-3 rounded-4 me-3 text-info">
                                    <i class="bi bi-signpost-split fs-2"></i>
                                </div>
                                <div>
                                    <p class="text-muted fw-semibold mb-0 text-uppercase" style="font-size: 0.8rem;">
                                        Rutas en Marcha</p>
                                    <h2 class="fw-bold text-dark mb-0">8</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div
                            class="card border-0 rounded-4 shadow-sm h-100 bg-white border-start border-5 border-secondary">
                            <div class="card-body d-flex align-items-center p-4">
                                <div class="bg-secondary bg-opacity-10 p-3 rounded-4 me-3 text-secondary">
                                    <i class="bi bi-truck fs-2"></i>
                                </div>
                                <div>
                                    <p class="text-muted fw-semibold mb-0 text-uppercase" style="font-size: 0.8rem;">
                                        Flota Asignada</p>
                                    <h2 class="fw-bold text-dark mb-0">12</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="bg-light p-2 rounded-pill d-inline-block mb-4 shadow-sm w-100">
                    <ul class="nav nav-pills nav-fill" id="logisticaTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill fw-bold" id="envios-tab" data-bs-toggle="tab"
                                data-bs-target="#envios" type="button" role="tab">
                                <i class="bi bi-box-seam me-1"></i> Panel de Envíos
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill fw-bold" id="rutas-tab" data-bs-toggle="tab"
                                data-bs-target="#rutas" type="button" role="tab">
                                <i class="bi bi-geo-alt me-1"></i> Gestión de Rutas
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill fw-bold" id="asignaciones-tab" data-bs-toggle="tab"
                                data-bs-target="#asignaciones" type="button" role="tab">
                                <i class="bi bi-person-badge me-1"></i> Asignaciones Diarias
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="tab-content" id="logisticaTabsContent">

                    <div class="tab-pane fade show active" id="envios" role="tabpanel">
                        <form th:action="@{/logistica/principal}" method="get" class="mb-4">
                            <div
                                class="d-flex flex-column flex-md-row justify-content-between align-items-md-center bg-light p-3 rounded-4">
                                <h5 class="fw-bold text-primary m-0 mb-3 mb-md-0"><i
                                        class="bi bi-search me-2"></i>Localizador</h5>
                                <div class="input-group w-auto bg-white rounded-pill shadow-sm overflow-hidden border">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i
                                            class="bi bi-search"></i></span>
                                    <input type="text" class="form-control border-0 shadow-none"
                                        placeholder="ID de envío o destino..." name="codEnvio">
                                    <button type="submit" class="btn btn-primary px-4 fw-medium"
                                        value="Buscar">Buscar</button>
                                </div>
                            </div>
                        </form>

                        <div class="p-5 text-center bg-light">
                            <div th:replace="~{fragments/logisticaTables :: listaEnvios}"></div>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="rutas" role="tabpanel">
                        <div class="d-flex justify-content-end mb-3">
                            <button type="button" class="btn btn-outline-primary rounded-pill px-4"
                                data-bs-toggle="modal">
                                <i class="bi bi-plus-lg me-1"></i> Diseñar Ruta
                            </button>
                        </div>
                        <div class="p-5 text-center border rounded-4 border-dashed opacity-50">
                            <p class="text-muted m-0">Aquí irá la tabla de Rutas</p>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="asignaciones" role="tabpanel">
                        <div class="d-flex justify-content-end mb-3">
                            <button type="button" class="btn btn-outline-primary rounded-pill px-4"
                                data-bs-toggle="modal" data-bs-target="#modalCrearAsignacion">
                                <i class="bi bi-link me-1"></i> Nueva Asignación
                            </button>
                        </div>
                        <div class="p-5 text-center border rounded-4 border-dashed opacity-50">
                            <p class="text-muted m-0">Aquí irá la tabla de Asignaciones</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/logisticaForms :: envioForm}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <script id="validationForm" th:src="@{/script/validationForm.js}"></script>
    <script id="accionesEnvio" th:src="@{/script/accionesEnvio.js}"></script>


    <script th:if="${modoEdicion}">
        var modalCrearEnvio = new bootstrap.Modal(document.getElementById('modalCrearEnvio'));
        modalCrearEnvio.show();
        console.log("abierto modal ");
    </script>


</body>

</html>
