<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignaciones - City Courier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <div id="row 1" class="row text flex-grow-1 m-0">

        <aside th:replace="~{fragments/general :: asideLogistica}"></aside>

        <main id="main" class="col-md-10 col-12 p-3 p-md-4">
            <div class="bg-white rounded-5 shadow-lg h-100 p-4 p-md-5">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
                    <div>
                        <h3 class="fw-bold text-info m-0"><i class="bi bi-person-badge-fill me-2"></i>Asignaciones
                            Diarias</h3>
                        <p class="text-muted m-0 mt-1">Vinculación de flota, personal y paquetería.</p>
                    </div>
                    <button type="button" class="btn btn-info text-white rounded-pill px-4 shadow-sm py-2 fw-medium"
                        data-bs-toggle="modal" data-bs-target="#modalCrearAsignacion">
                        <i class="bi bi-link me-2"></i> Nueva Asignación
                    </button>
                </div>

                <div class="p-4 text-center border rounded-4 border-info border-opacity-25 bg-light">
                    <div th:replace="~{fragments/logisticaTables :: listaAsignaciones}"></div>
                </div>

            </div>
        </main>
    </div>

    <!--<div th:replace="~{fragments/logisticaForms :: envioForm}"></div>-->

    <div th:replace="~{fragments/logisticaForms :: asignacionForm}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script id="validationForm" th:src="@{/script/validationForm.js}"></script>

</body>

</html>
