<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Repartidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../../static/script/validationRiderForm.js" th:src="@{/script/validationRiderForm.js}" defer></script>

</head>

<body>
    <div th:fragment="riderForm" class="container bg-primary text-light p-4 mt-5 rounded-4">
        <form method="post" th:action="@{/createRider/submit}" th:object="${repartidor}" class="needs-validation "
            novalidate>
            <fieldset class=" mb-3">
                <h1>Datos personales</h1>
                <div id="nombreyApellido" class="row mb-3">
                    <div id="nombre" class=" col-sm-12 col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="nombre"
                            required>
                        <div class="invalid-feedback">
                            Debe introducir un nombre.
                        </div>
                    </div>

                    <div id="apellido" class="col-sm-12 col-md-6">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" th:field="*{apellido}"
                            placeholder="apellido" required>
                        <div class="invalid-feedback">
                            Debe introducir un apellido.
                        </div>
                    </div>


                </div>
                <div id="emailYTelefono" class="row mb-3">
                    <div id="email" class="col-sm-12 col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="email"
                            required>
                        <div class="invalid-feedback">
                            Debe introducir un correo electrónico válido.
                        </div>
                    </div>
                    <div id="telefono" class="col-sm-12 col-md-6">
                        <label for="telefono" class="form-label">Telefono</label>
                        <input type="tel" class="form-control" id="telefono" th:field="*{telefono}"
                            placeholder="telefono" required>
                        <div class="invalid-feedback">
                            Debe introducir un número de teléfono válido.
                        </div>
                    </div>
                </div>

                <div id="dniYFecha" class="row mb-3">
                    <div id="dni" class="col-sm-12 col-md-6">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" class="form-control" id="dni" th:field="*{dni}" placeholder="dni" required>
                        <div class="invalid-feedback">
                            Debe introducir un DNI válido.
                        </div>
                    </div>
                    <div id="fechaNacimiento" class="col-sm-12 col-md-6">
                        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}"
                            required>
                        <div class="invalid-feedback">
                            Debe introducir una fecha de nacimiento válida.
                        </div>
                    </div>
                </div>

            </fieldset>

            <fieldset>
                <h1>Datos de reparto</h1>
                <div id="zona" class="mb-5 row ">
                    <div class="col-sm-12 col-md-6 ">
                        <div class="input-group mb-3 has-validation">
                            <label class="input-group-text" for="zona">Zona</label>
                            <select class="form-select" name="zona" id="zona">
                                <option value="arahal " th:selected="${repartidor.zona == 'arahal'}">Arahal</option>
                                <option value="carmona" th:selected="${repartidor.zona == 'carmona'}">Carmona</option>
                                <option value="ecija" th:selected="${repartidor.zona == 'ecija'}">Écija</option>
                                <option value="fuentesdeandalucia"
                                    th:selected="${repartidor.zona == 'fuentesdeandalucia'}">
                                    Fuentes de Andalucía</option>
                                <option value="lantejuela" th:selected="${repartidor.zona == 'lantejuela'}">La
                                    Lantejuela
                                </option>
                                <option value="marchena" th:selected="${repartidor.zona == 'marchena'}">Marchena
                                </option>
                                <option value="moron" th:selected="${repartidor.zona == 'moron'}">Morón de la Frontera
                                </option>
                                <option value="osuna" th:selected="${repartidor.zona == 'osuna'}">Osuna</option>
                                <option value="paradas" th:selected="${repartidor.zona == 'paradas'}">Paradas</option>
                                <option value="utrera" th:selected="${repartidor.zona == 'utrera'}">Utrera</option>
                            </select>
                            <div class="invalid-feedback">
                                Debe seleccionar una zona.
                            </div>
                        </div>
                    </div>



                </div>
            </fieldset>

            <div id="botonCrear" class="mb-3">
                <input type="submit" value="Crear repartidor">
            </div>
        </form>


    </div>
