<div th:fragment="riderForm" class="modal fade" id="modalCrearRepartidor" tabindex="-1" aria-labelledby="modalLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">
        <div class="modal-content text-dark border-0 shadow">

            <div class="modal-header bg-primary text-white border-0">
                <h5 class="modal-title fw-bold" id="modalLabel">
                    <i class="bi bi-person-plus-fill me-2"></i>Nuevo Repartidor
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>

            <div class="modal-body p-4 p-md-5">

                <form method="post" th:action="@{/rrhh/createRider/submit}" th:object="${repartidor}"
                    class="needs-validation" novalidate>

                    <h6 class="text-primary fw-bold border-bottom pb-2 mb-4">Datos Personales</h6>

                    <div class="row mb-3">
                        <div class="col-sm-12 col-md-6 mb-3 mb-md-0">
                            <label for="nombre" class="form-label fw-medium">Nombre</label>
                            <input type="text" class="form-control bg-light border-0" id="nombre" th:field="*{nombre}"
                                placeholder="Ej. Juan" required>
                            <div class="invalid-feedback">Debe introducir un nombre.</div>
                        </div>

                        <div class="col-sm-12 col-md-6">
                            <label for="apellidos" class="form-label fw-medium">Apellidos</label>
                            <input type="text" class="form-control bg-light border-0" id="apellidos"
                                th:field="*{apellidos}" placeholder="Ej. Pérez" required>
                            <div class="invalid-feedback">Debe introducir un apellido.</div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-12 col-md-6 mb-3 mb-md-0">
                            <label for="email" class="form-label fw-medium">Email</label>
                            <input type="email" class="form-control bg-light border-0" id="email" th:field="*{email}"
                                placeholder="correo@ejemplo.com" required>
                            <div class="invalid-feedback">Debe introducir un correo electrónico válido.</div>
                        </div>

                        <div class="col-sm-12 col-md-6">
                            <label for="telefono" class="form-label fw-medium">Teléfono</label>
                            <input type="tel" class="form-control bg-light border-0" id="telefono"
                                th:field="*{telefono}" placeholder="Ej. 600123456" required>
                            <div class="invalid-feedback">Debe introducir un número válido.</div>
                        </div>
                    </div>

                    <div class="row mb-5">
                        <div class="col-sm-12 col-md-6 mb-3 mb-md-0">
                            <label for="dni" class="form-label fw-medium">DNI</label>
                            <input type="text" class="form-control bg-light border-0" id="dni" th:field="*{dni}"
                                placeholder="12345678A" required>
                            <div class="invalid-feedback">Debe introducir un DNI válido.</div>
                        </div>


                    </div>

                    <h6 class="text-primary fw-bold border-bottom pb-2 mb-4">Datos de Reparto</h6>

                    <div class="row mb-4">
                        <div class="col-sm-12 col-md-6">
                            <label for="zona" class="form-label fw-medium">Zona Asignada</label>
                            <select class="form-select bg-light border-0" id="zona" th:field="*{zona}" required>
                                <option value="" disabled selected>Seleccione una zona...</option>
                                <option value="arahal">Arahal</option>
                                <option value="carmona">Carmona</option>
                                <option value="ecija">Écija</option>
                                <option value="fuentesdeandalucia">Fuentes de Andalucía</option>
                                <option value="lantejuela">La Lantejuela</option>
                                <option value="marchena">Marchena</option>
                                <option value="moron">Morón de la Frontera</option>
                                <option value="osuna">Osuna</option>
                                <option value="paradas">Paradas</option>
                                <option value="utrera">Utrera</option>
                            </select>
                            <div class="invalid-feedback">Debe seleccionar una zona.</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-5">
                        <button type="button" class="btn btn-outline-secondary px-4 rounded-pill"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4 rounded-pill">
                            <i class="bi bi-save me-2"></i>Crear Repartidor
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
