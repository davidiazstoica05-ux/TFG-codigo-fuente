<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>General</title>
</head>

<body>
    <header id="header" th:fragment="header"
        class="container-fluid border-2 d-flex justify-content-between bg-primary text-light">
        <h2 class="p-2">City Courier</h2>
        <div id="cuenta" class=" pe-4 pt-3 text-end d-flex gap-3">
            <i class="bi bi-bell h4"></i>
            <i class="bi bi-person-circle h4"></i>
        </div>
    </header>
    <aside id="aside" th:fragment="aside"
        class="list-group col-md-2 rounded-0 col-12 overflow-hidden h6 border-end border-1 ">
        <a href="#" class="list-group-item list-group-item-action border-0 p-3 mt-1 text-dark"><i
                class="bi bi-house h3 pe-4"></i>Home</a>

        <a href="#" class="list-group-item list-group-item-action border-0 p-3 text-dark">
            <i class="bi bi-bicycle h3 pe-4"></i>Repartidores
            <div class="collapse mt-2" id="collapseExample">
                <a href="#" class="list-group-item list-group-item-action border-0 text-dark p-2">
                    <i class="bi bi-bicycle h3 pe-4"></i>Añadir repartidor</a>
                <a href="#" class="list-group-item list-group-item-action border-0 text-dark p-2">
                    <i class="bi bi-bicycle h3 pe-4"></i>Ver repartidores</a>
            </div>
        </a>
        <a href="#" class="list-group-item list-group-item-action border-0 p-3 text-dark"><i
                class="bi bi-box-seam h3 pe-4"></i>Envíos pendientes</a>
        <a href="#" class="list-group-item list-group-item-action border-0 p-3 text-dark"> <i
                class="bi bi-gear-wide-connected h3 pe-4"></i>Configuración</a>
    </aside>


</body>

</html>
