<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>General</title>
</head>

<body>
    <header id="header" th:fragment="header"
        class="p-2 border-bottom border-3 border-primary bg-primary text-secondary">
        <nav class="navbar navbar-expand-md navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand text-decoration-none m-0 p-0" href="#">
                    <h1 class="m-0">
                        <span class="fw-bold text-light">City </span>
                        <span class="fw-bold text-light">Courier</span>
                    </h1>
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon bg-primary rounded-1"></span>
                </button>
                <div class="collapse navbar-collapse ms-sm-5 justify-content-between justify-content-md-end fs-5"
                    id="collapsibleNavbar">
                    <ul class="navbar-nav d-md-none pt-3">
                        <li class="nav-item ">
                            <a class="nav-link text-light fw-bold" href="#"><i class="bi bi-house-door me-4"></i>
                                HOME</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light fw-bold" href="#"><i class="bi bi-bicycle me-4"></i>
                                Repartidores</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light fw-bold" href="#"><i class="bi bi-box-seam me-4"></i>
                                Envíos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light fw-bold" href="#"><i class="bi bi-map me-4"></i>
                                Rutas</a>
                        </li>
                    </ul>
                    <div id="cuenta" class="text-end d-flex gap-3 align-items-center mt-3 mt-sm-0 pe-sm-4">
                        <div class="dropdown">
                            <button class="btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle h4 mb-0 text-light me-2 fs-2"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#"><i class="bi bi-arrow-left-right me-4 fs-5"></i>
                                        Cambiar Cuenta</a></li>
                                <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-left me-4 fs-5"></i>
                                        Cerrar Sesión</a></li>
                            </ul>
                        </div>
                    </div>


                </div>
            </div>
        </nav>
    </header>
    <aside id="aside" th:fragment="aside"
        class="list-group col-md-2 rounded-0 col-12 overflow-hidden h6 border-end border-1 d-none d-md-block">
        <a href="#" class="list-group-item list-group-item-action border-0 p-3 mt-1 text-primary"><i
                class="bi bi-house h3 pe-4"></i>Home</a>


        <button class="list-group-item list-group-item-action border-0 p-3 text-primary text-start" type="button"
            data-bs-toggle="collapse" data-bs-target="#collapseRepartidores" aria-expanded="false"
            aria-controls="collapseRepartidores">
            <i class="bi bi-bicycle h3 pe-4"></i>Repartidores
        </button>
        <div class="collapse" id="collapseRepartidores">
            <ul class="list-group list-group-flush bg-light">
                <a href="#" class="list-group-item list-group-item-action border-0 ps-5 py-2 bg-transparent">Listado
                    de
                    Repartidores</a>
                <a href="#" class="list-group-item list-group-item-action border-0 ps-5 py-2 bg-transparent">Nuevo
                    Repartidor</a>
            </ul>
        </div>

        <button class="list-group-item list-group-item-action border-0 p-3 text-primary text-start" type="button"
            data-bs-toggle="collapse" data-bs-target="#collapseEnvios" aria-expanded="false"
            aria-controls="collapseEnvios">
            <i class="bi bi-box-seam h3 pe-4"></i>Envíos
        </button>
        <div class="collapse" id="collapseEnvios">
            <ul class="list-group list-group-flush bg-light">
                <a href="#" class="list-group-item list-group-item-action border-0 ps-5 py-2 bg-transparent">Listado
                    de
                    Envíos</a>
            </ul>


        </div>

        <button class="list-group-item list-group-item-action border-0 p-3 text-primary text-start" type="button"
            data-bs-toggle="collapse" data-bs-target="#collapseRutas" aria-expanded="false"
            aria-controls="collapseRutas">
            <i class="bi bi-map h3 pe-4"></i>Rutas
        </button>
        <div class="collapse" id="collapseRutas">
            <ul class="list-group list-group-flush bg-light">
                <a href="#" class="list-group-item list-group-item-action border-0 ps-5 py-2 bg-transparent">Listado
                    de
                    Rutas</a>
                <a href="#" class="list-group-item list-group-item-action border-0 ps-5 py-2 bg-transparent">Nueva
                    Ruta</a>
            </ul>
        </div>
    </aside>


</body>

</html>
