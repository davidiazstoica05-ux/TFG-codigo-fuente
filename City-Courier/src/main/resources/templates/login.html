<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City Courier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">

        <div class="bg-white rounded-5 shadow-lg p-4 p-md-5 w-100 max-w-450">

            <div class="text-center mb-4">
                <i class="bi bi-box-seam-fill text-primary icon-large-3"></i>
                <h2 class="fw-bold text-primary mt-2">Iniciar Sesión</h2>
                <p class="text-muted">Bienvenido a City Courier</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger rounded-4 py-2 text-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Credenciales incorrectas.
            </div>
            <div th:if="${param.logout}" class="alert alert-success rounded-4 py-2 text-center" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> Has cerrado sesión correctamente.
            </div>

            <form th:action="@{/login}" method="POST">

                <div class="mb-3">
                    <label for="username" class="form-label fw-medium">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-4"><i
                                class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 bg-light rounded-end-4 py-2" id="username"
                            name="username" placeholder="Introduce tu usuario" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-4"><i
                                class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 bg-light rounded-end-4 py-2"
                            id="password" name="password" placeholder="Introduce tu contraseña" required>
                    </div>
                </div>

                <button type="submit"
                    class="btn btn-primary w-100 rounded-4 py-2 fw-bold fs-5 shadow-sm">Entrar</button>

            </form>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
