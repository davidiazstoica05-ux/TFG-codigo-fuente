<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-body-secondary d-flex justify-content-center align-items-center vh-100">
    <div id="container1" class="container-fluid w-50 border rounded-5 p-5 shadow-sm bg-body-tertiary">
        <form id="form" class="text-center">
            <h1 class="text-center pb-5 text-primary">Login</h1>
            <fieldset id="fieldset1">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Recipient’s username"
                        aria-label="Recipient’s username" aria-describedby="basic-addon2">
                    <span class="input-group-text" id="basic-addon2">@example.com</span>
                </div>
            </fieldset>
            <fieldset id="fieldset2">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-lock"></i></span>
                    <input type="text" class="form-control" placeholder="Contraseña" aria-label="Contraseña"
                        aria-describedby="basic-addon1">
                </div>
            </fieldset>
            <button type="submit" class="btn btn-primary ">Iniciar Sesión</button>
        </form>
        <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    </div>

</body>

</html>
