<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../static/validation.js" defer></script>
</head>

<body class="bg-body-secondary d-flex justify-content-center align-items-center vh-100">
    <div id="container1"
        class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4 border rounded-5 p-4 p-sm-5 shadow-sm bg-body-tertiary">

        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 pb-3 border-bottom">
            <h1 class="text-primary m-0 fs-2 fw-bold">Login</h1>
            <div class="btn-group mt-2 mt-sm-0 shadow-sm" role="group" aria-label="Selección de rol">
                <input type="radio" name="role_switch" id="Admin" class="btn-check" autocomplete="off" checked>
                <label class="btn btn-outline-primary btn-sm px-3 rounded-start-pill fw-semibold"
                    for="Admin">Admin</label>

                <input type="radio" name="role_switch" id="Repartidor" class="btn-check" autocomplete="off">
                <label class="btn btn-outline-primary btn-sm px-3 rounded-end-pill fw-semibold"
                    for="Repartidor">Repartidor</label>
            </div>
        </div>
        <form id="form" class="text-center needs-validation" novalidate>

            <fieldset id="fieldset1">
                <div class="input-group mb-3 has-validation">
                    <input type="text" class="form-control" placeholder="Email" aria-label="email"
                        aria-describedby="basic-addon2" required>
                    <span class="input-group-text" id="basic-addon2">@example.com</span>
                    <div class="invalid-feedback">Por favor, introduzca su correo electrónico</div>
                </div>
            </fieldset>
            <fieldset id="fieldset2">
                <div class="input-group mb-3 has-validation">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Password" aria-label="password"
                        aria-describedby="basic-addon1" required>
                    <div class="invalid-feedback">Por favor, introduzca su contraseña</div>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-primary ">Iniciar Sesión</button>
        </form>
        <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    </div>

</body>

</html>
