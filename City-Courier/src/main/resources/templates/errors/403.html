<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - City Courier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">

        <div class="bg-white rounded-5 shadow-lg p-4 p-md-5 text-center w-100" style="max-width: 500px;">

            <div class="mb-4">
                <i class="bi bi-shield-lock-fill text-warning" style="font-size: 4.5rem;"></i>
            </div>

            <span class="badge bg-light text-muted rounded-pill px-3 py-2 fw-bold mb-2">ERROR 403</span>

            <h2 class="fw-bold text-primary mb-3">¡Zona Restringida!</h2>

            <p class="text-muted fs-6 mb-4">
                Lo sentimos, pero el departamento de seguridad ha determinado que tu cuenta no tiene las
                <strong>llaves de acceso</strong> necesarias para cruzar a este pasillo de la aplicación.
            </p>

            <div class="d-grid gap-2">
                <a th:href="@{/}"
                    class="btn btn-primary rounded-4 py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-house-door-fill"></i> Volver a mi panel seguro
                </a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
