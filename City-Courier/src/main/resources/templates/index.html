<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index-TFG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/general.css}">



</head>

<body class="min-vh-100 d-flex flex-column bg-primary">

    <div th:replace="~{fragments/general :: header}"></div>

    <div id="row 1" class="row text flex-grow-1 m-0">

        <aside th:replace="~{fragments/general :: asideOperador}"></aside>

        <main id="main" class="col-md-10 col-12 p-3 p-md-4">

            <div class="bg-white rounded-5 shadow-lg h-100 p-4 p-md-5">

                <h3 class="fw-bold text-primary mb-4">Panel de Control: Operador</h3>

                <div id="rowResumen" class="row row-cols-1 row-cols-md-3 g-4 text-center">

                    <div class="col">
                        <div class="card border-0 rounded-4 shadow-sm h-100 bg-light">
                            <div class="card-header bg-warning text-dark border-0 rounded-top-4 py-3">
                                <i class="bi bi-box2-heart-fill fs-3"></i>
                                <h5 class="fw-bold mb-0 mt-2">Envíos Hoy</h5>
                            </div>
                            <div class="card-body">
                                <h2 class="display-6 fw-bold">255</h2>
                                <div class="d-flex flex-column gap-3 mt-4 text-start">
                                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                                        <span class="fw-medium"><i
                                                class="bi bi-check-circle-fill text-success me-2"></i>Entregados</span>
                                        <span class="badge bg-success rounded-pill fs-6 px-3">25</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                                        <span class="fw-medium"><i
                                                class="bi bi-clock-fill text-warning me-2"></i>Pendientes</span>
                                        <span class="badge bg-warning text-dark rounded-pill fs-6 px-3">230</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center pb-1">
                                        <span class="fw-medium"><i
                                                class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Incidencias</span>
                                        <span class="badge bg-danger rounded-pill fs-6 px-3">25</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card border-0 rounded-4 shadow-sm h-100 bg-light">
                            <div class="card-header bg-info text-white border-0 rounded-top-4 py-3">
                                <i class="bi bi-person-lines-fill fs-3"></i>
                                <h5 class="fw-bold mb-0 mt-2">Mis Gestiones</h5>
                            </div>
                            <div class="card-body d-flex flex-column justify-content-center">
                                <h2 class="display-6 fw-bold text-info">42</h2>
                                <p class="text-muted mb-0">Envíos registrados por ti hoy</p>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card border-0 rounded-4 shadow-sm h-100 bg-light">
                            <div class="card-header bg-danger text-white border-0 rounded-top-4 py-3">
                                <i class="bi bi-bell-fill fs-3"></i>
                                <h5 class="fw-bold mb-0 mt-2">Alertas Activas</h5>
                            </div>
                            <div class="card-body d-flex flex-column justify-content-center">
                                <h2 class="display-6 fw-bold text-danger">3</h2>
                                <p class="text-muted mb-0">Reclamos de clientes sin resolver</p>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="my-5 text-secondary opacity-25">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-primary m-0">Últimos Envíos Entregados</h4>
                    <a href="#" class="btn btn-outline-primary btn-sm">Ver histórico completo</a>
                </div>

                <div class="table-responsive rounded-3 shadow-sm border border-light">
                    <div>
                        <div class="p-5 text-center bg-light">
                            <div class="spinner-border text-primary mb-3" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="text-muted mb-0">Cargando datos de entregas...</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>



</html>
